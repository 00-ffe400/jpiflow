<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212121">
  <meta name="description" content="ExamVue 365 Flow 로그인 화면 디자인 및 실시간 3D 인터랙션 미리보기">
  <title>Login · ExamVue 365 Flow</title>
  <link rel="preload" href="../assets/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="studio.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#email">로그인으로 이동</a>
  <main class="login-page">
    <section class="visual-panel" aria-label="푸른 유리 큐브 3D 인터랙션">
      <div id="scene" class="scene" role="img" aria-label="빛나는 푸른 유리 큐브와 입체 타일"></div>
      <div id="scene-fallback" class="scene-fallback"></div>
      <p id="scene-error" class="scene-error" hidden>이 브라우저에서는 3D를 표시할 수 없습니다. 로그인은 계속 사용할 수 있습니다.</p>
      <div class="scene-tools" id="scene-tools">
        <button type="button" id="studio-toggle" class="scene-button" aria-expanded="false" aria-controls="studio"><span aria-hidden="true">⚙</span> 3D 설정</button>
        <button type="button" id="motion-toggle" class="scene-button" aria-pressed="false">모션 일시정지</button>
      </div>
      <aside id="studio" class="studio" aria-label="3D 설정" hidden></aside>
    </section>
    <section class="form-panel" aria-labelledby="login-title">
      <form id="login-form" class="login-form" novalidate>
        <h1 id="login-title" class="intro-unit">Welcome Our Service</h1>
        <div class="fields intro-unit">
          <div class="input-group"><label class="sr-only" for="email">Email</label><input type="email" id="email" name="email" autocomplete="username" inputmode="email" placeholder="Email" required aria-describedby="email-error"><p class="field-error" id="email-error" hidden></p></div>
          <div class="input-group"><div class="password-field"><label class="sr-only" for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" placeholder="Password" required aria-describedby="password-error"><button type="button" id="password-toggle" aria-label="비밀번호 표시" aria-pressed="false"><img src="assets/eye.svg" alt="" width="24" height="24"></button></div><p class="field-error" id="password-error" hidden></p></div>
          <label class="remember"><input id="remember" type="checkbox" checked><span class="checkbox-mark"><img src="assets/check.svg" alt="" width="16" height="16"></span><span>아이디 기억하기</span></label>
        </div>
        <button class="primary login-submit intro-unit" type="submit">Login</button>
        <nav class="account-links intro-unit" aria-label="계정 관리"><button type="button" data-dialog="find-id">아이디 찾기</button><span></span><button type="button" data-dialog="reset-password">비밀번호 찾기</button><span></span><button type="button" data-dialog="sign-up">회원가입</button></nav>
      </form>
    </section>
  </main>
  <dialog id="account-dialog" aria-labelledby="dialog-title"><div class="modal-card"><button type="button" class="dialog-close icon-button" aria-label="모달 닫기">×</button><span class="modal-unit modal-kicker">EXAMVUE 365 FLOW</span><h2 id="dialog-title" class="modal-unit"></h2><p id="dialog-description" class="modal-unit"></p><div id="dialog-content" class="modal-unit"></div><button type="button" class="primary modal-unit dialog-close" id="dialog-confirm">확인</button></div></dialog>
  <noscript><p class="noscript">이 미리보기의 3D와 로그인 데모를 사용하려면 JavaScript를 켜 주세요.</p></noscript>
</body>
</html>
